[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "caishenx"
version = "0.1.0"
description = "Brazilian stock dashboard for B3 exchange"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.28",
    "pandas>=2.0",
    "plotly>=5.18",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "yfinance>=0.2.28",
]

[tool.setuptools.packages.find]
include = ["backend*", "frontend*"]
